<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Signal Path</title>
<meta name="description" content="A synth learning lab: patch a mono synth, watch the waveform, spectrum and envelopes, and follow guided lessons.">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Signal Path">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jura:wght@400;500;600;700&family=Major+Mono+Display&family=IBM+Plex+Mono:wght@300;400&display=swap">
<style>
:root{--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
html,body{touch-action:manipulation}
/* Layout: one-screen instrument on a true-black OLED. Header, two-page pager (Patch | Scope), coach strip, outline keyboard.
   Everything is drawn as thin lit lines; colour marks the synth section (osc cyan, filter magenta, env yellow, LFO violet). */
:root{
  color-scheme:dark;
  --bg:#000; --ink:#f2f5f8; --dim:#7c8794; --faint:#3b434d; --line:#1d232a; --line2:#2b333c;
  --c1:#3fe4ff; --c1s:rgba(63,228,255,.13);
  --c2:#ff52d6; --c2s:rgba(255,82,214,.13);
  --c3:#ffd447; --c3s:rgba(255,212,71,.13);
  --c4:#a28cff; --c4s:rgba(162,140,255,.14);
  --ok:#7dffd0;
  --mc:var(--c1); --mcs:var(--c1s);
  --f-ui:"Jura","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-disp:"Major Mono Display","Jura",ui-monospace,monospace;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --glowT:0 0 6px currentColor;
}
[hidden]{display:none!important}
html{box-sizing:border-box;height:100%;background:#000}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;font-weight:500;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;overscroll-behavior:none;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,.knob:focus-visible{outline:1px solid var(--c1);outline-offset:3px;border-radius:6px}
.lab{font-family:var(--f-ui);font-weight:600;text-transform:uppercase;letter-spacing:.14em;font-size:10.5px}
.defs{position:absolute;width:0;height:0;overflow:hidden}
#app{height:100%;max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:8px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));padding-top:max(8px,var(--sat,0px));padding-bottom:max(8px,var(--sab,0px))}

/* HUD corner brackets: shared by screens, module, coach */
.hud{--br:var(--line2);background:
  linear-gradient(var(--br),var(--br)) 0 0/12px 1px no-repeat, linear-gradient(var(--br),var(--br)) 0 0/1px 12px no-repeat,
  linear-gradient(var(--br),var(--br)) 100% 0/12px 1px no-repeat, linear-gradient(var(--br),var(--br)) 100% 0/1px 12px no-repeat,
  linear-gradient(var(--br),var(--br)) 0 100%/12px 1px no-repeat, linear-gradient(var(--br),var(--br)) 0 100%/1px 12px no-repeat,
  linear-gradient(var(--br),var(--br)) 100% 100%/12px 1px no-repeat, linear-gradient(var(--br),var(--br)) 100% 100%/1px 12px no-repeat,
  #000}

/* header */
.top{display:flex;align-items:center;gap:12px;flex:0 0 auto;height:38px}
.iconbtn{width:34px;height:34px;display:grid;place-items:center;color:var(--ink)}
.iconbtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.3;stroke-linecap:round}
.pages{display:flex;gap:18px;align-items:center}
.pages>button{position:relative;height:30px;font-weight:600;text-transform:uppercase;letter-spacing:.2em;font-size:12px;color:var(--faint);transition:color .2s,text-shadow .2s}
.pages>button.on{color:var(--ink);text-shadow:0 0 8px rgba(242,245,248,.55)}
.pages>button::after{content:"";position:absolute;left:0;right:.2em;bottom:2px;height:1px;background:var(--ink);box-shadow:0 0 6px var(--ink);transform:scaleX(0);transition:transform .25s}
.pages>button.on::after{transform:none}
.readout{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;line-height:1.05}
.readout b{font-family:var(--f-disp);font-weight:400;font-size:19px;color:var(--c1);text-shadow:0 0 8px rgba(63,228,255,.65);display:flex;align-items:center;gap:7px;text-transform:lowercase}
.readout b i{width:6px;height:6px;border-radius:50%;border:1px solid var(--faint);display:inline-block;transition:all .1s}
.readout b i.on{background:var(--c1);border-color:var(--c1);box-shadow:0 0 8px var(--c1)}
.readout span{font-family:var(--f-mono);font-weight:300;font-size:10.5px;color:var(--dim);font-variant-numeric:tabular-nums;letter-spacing:.04em}

/* segmented controls (text + line icon, lit when on) */
.seg{display:flex;gap:2px;border-bottom:1px solid var(--line)}
.seg>button{flex:1;min-width:0;height:30px;font-weight:600;text-transform:uppercase;letter-spacing:.12em;font-size:11px;color:var(--dim);display:flex;align-items:center;justify-content:center;gap:5px;position:relative;transition:color .15s}
.seg>button svg{flex:0 0 auto;width:16px;height:13px;fill:none;stroke:currentColor;stroke-width:1.3;stroke-linejoin:round;stroke-linecap:round}
.seg>button::after{content:"";position:absolute;left:18%;right:18%;bottom:-1px;height:1.5px;background:var(--mc);box-shadow:0 0 6px var(--mc);opacity:0;transition:opacity .2s}
.seg>button.on{color:var(--mc);text-shadow:var(--glowT)}
.seg>button.on svg{filter:drop-shadow(0 0 3px currentColor)}
.seg>button.on::after{opacity:1}

/* pager + screens */
.pager{flex:1 1 auto;min-height:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;gap:16px}
.pager::-webkit-scrollbar{display:none}
.page{flex:0 0 100%;scroll-snap-align:start;scroll-snap-stop:always;display:flex;flex-direction:column;gap:8px;min-height:0;min-width:0}
.screen{position:relative;overflow:hidden}
.screen canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.screen .tag{position:absolute;left:12px;top:8px;font-family:var(--f-mono);font-weight:300;font-size:10px;color:var(--dim);pointer-events:none;letter-spacing:.06em;text-transform:lowercase}
.screen .tag.r{left:auto;right:12px}
#bigTagR{color:var(--c2);text-shadow:0 0 6px var(--c2)}
.mini{flex:0 0 100px;cursor:pointer}

/* patch tabs + module */
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:0 0 auto;border-bottom:1px solid var(--line)}
.tabs::-webkit-scrollbar{display:none}
.tabs button{--tc:var(--c1);flex:1 0 auto;padding:0 8px;height:32px;position:relative;font-weight:600;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);transition:color .15s}
.tabs button::before{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;border:1px solid var(--tc);margin-right:6px;vertical-align:1px;opacity:.7}
.tabs button.on{color:var(--tc);text-shadow:var(--glowT)}
.tabs button.on::before{background:var(--tc);box-shadow:0 0 6px var(--tc);opacity:1}
.tabs button::after{content:"";position:absolute;left:10%;right:10%;bottom:-1px;height:1.5px;background:var(--tc);box-shadow:0 0 6px var(--tc);opacity:0;transition:opacity .2s}
.tabs button.on::after{opacity:1}
.tabs button.dot::after,.pages>button.dot::after{content:"";position:absolute;top:4px;right:0;left:auto;bottom:auto;width:5px;height:5px;border-radius:50%;background:var(--c3);box-shadow:0 0 6px var(--c3);opacity:1;transform:none}
.pages>button.dot::after{right:-9px}
.module{flex:1 1 auto;min-height:0;overflow-y:auto;padding:12px 6px 8px;display:flex;flex-direction:column;gap:10px;animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:.25}to{opacity:1}}
.mod-row{display:flex;align-items:center;gap:8px}
.mod-row .lab{color:var(--mc);min-width:62px;opacity:.75}
.mod-row .seg{flex:1}
.kgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px}
.kgrid.c4{grid-template-columns:repeat(4,minmax(0,1fr))}

/* knobs: line-art dial */
.knob{display:flex;flex-direction:column;align-items:center;padding:4px 2px 6px;border-radius:10px;touch-action:none;cursor:ns-resize;min-width:0}
.knob svg{width:58px;height:58px;overflow:visible}
.c4 .knob svg{width:48px;height:48px}
.k-tick{stroke:var(--faint);stroke-width:1;stroke-linecap:round}
.k-trk{fill:none;stroke:var(--line2);stroke-width:1}
.k-arc{fill:none;stroke:var(--mc);stroke-width:2.4;stroke-linecap:round}
.k-cap{fill:#000;stroke:var(--line2);stroke-width:1}
.k-ptr{stroke:var(--ink);stroke-width:1.6;stroke-linecap:round}
.k-lab{font-weight:600;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;margin-top:1px}
.k-v{font-family:var(--f-mono);font-weight:300;font-size:11px;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.knob.active .k-v{color:var(--mc);text-shadow:var(--glowT)}
.knob.active .k-cap{stroke:var(--mc)}
.knob.active .k-ptr{stroke:var(--mc)}
.tog{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;border-radius:10px;padding:6px 2px;min-height:88px}
.tog .led{width:32px;height:14px;border-radius:8px;border:1px solid var(--line2);position:relative;transition:border-color .15s}
.tog .led::after{content:"";position:absolute;left:2px;top:2px;width:8px;height:8px;border-radius:50%;border:1px solid var(--dim);transition:transform .2s,background .2s}
.tog.on .led{border-color:var(--mc)}
.tog.on .led::after{transform:translateX(18px);background:var(--mc);border-color:var(--mc);box-shadow:0 0 8px var(--mc)}
.tog .sub{font-family:var(--f-mono);font-weight:300;font-size:9.5px;color:var(--faint)}
.hint{animation:pulse 1.5s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 1px rgba(255,212,71,.75)}50%{box-shadow:0 0 0 1px rgba(255,212,71,.9),0 0 16px 1px rgba(255,212,71,.35)}}

/* scope page */
.sbar{display:flex;gap:8px;align-items:center;flex:0 0 auto}
.sbar .seg{flex:1}
#pgScope{--mc:var(--c1)}
.chip{height:28px;padding:0 10px;border-radius:14px;border:1px solid var(--line2);color:var(--dim);transition:all .15s}
.chip.on{color:var(--ink);border-color:var(--ink);text-shadow:var(--glowT);box-shadow:0 0 8px rgba(242,245,248,.25)}
.run{min-width:54px}
.run.stop{color:var(--c2);border-color:var(--c2);box-shadow:0 0 8px var(--c2s)}
.big{flex:1 1 auto;min-height:150px}
.sfoot{flex:0 0 auto;display:flex;align-items:center;gap:8px;min-height:32px}
.sfoot .info{flex:1;min-width:0;font-family:var(--f-mono);font-weight:300;font-size:10.5px;color:var(--dim);text-align:center;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.03em}
.zb{width:38px;height:30px;border-radius:15px;border:1px solid var(--line2);font-family:var(--f-mono);font-weight:300;font-size:17px;color:var(--ink)}
.legend{display:flex;gap:12px;justify-content:center;flex:1}
.legend i{display:inline-block;width:14px;height:1.5px;margin-right:5px;vertical-align:middle}

/* coach */
.coach{flex:0 0 auto;padding:10px 12px 10px;display:flex;flex-direction:column;gap:7px;position:relative;--br:var(--faint)}
.coach-top{display:flex;align-items:center;gap:8px}
.crumb{display:flex;align-items:baseline;gap:7px;color:var(--c3);text-shadow:0 0 7px rgba(255,212,71,.5);min-width:0;flex:1;text-align:left}
.crumb span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb .n{color:var(--dim);text-shadow:none;font-family:var(--f-mono);font-weight:300;font-size:10.5px;letter-spacing:.04em;text-transform:none;flex:0 0 auto}
.nordtag{font-weight:700;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--c2);border:1px solid var(--c2);border-radius:10px;padding:2px 7px;flex:0 0 auto;text-shadow:0 0 6px var(--c2)}
.learnbtn{height:24px;padding:0 10px;border-radius:12px;border:1px solid var(--c1);color:var(--c1);font-weight:700;font-size:10px;letter-spacing:.14em;text-transform:uppercase;flex:0 0 auto;text-shadow:0 0 6px rgba(63,228,255,.6);box-shadow:0 0 8px var(--c1s)}
.minbtn{width:26px;height:24px;color:var(--dim);display:grid;place-items:center}
.minbtn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.4;transition:transform .2s}
.coach.min .minbtn svg{transform:rotate(180deg)}
.prog{height:1px;background:var(--line2);position:relative}
.prog i{display:block;height:1px;background:var(--c3);box-shadow:0 0 6px var(--c3);transition:width .35s;position:relative}
.prog i::after{content:"";position:absolute;right:-2px;top:-2px;width:5px;height:5px;border-radius:50%;background:var(--c3);box-shadow:0 0 8px var(--c3)}
.ctext{margin:0;font-size:15px;line-height:1.42;font-weight:500;color:var(--ink);text-wrap:pretty;text-shadow:0 0 10px rgba(242,245,248,.18);animation:fadeIn .3s ease}
.cfig{max-width:340px;animation:fadeIn .3s ease}
.math{font-family:var(--f-mono);font-weight:300;font-size:12px;color:var(--c1);text-shadow:0 0 6px rgba(63,228,255,.45);border-left:1px solid var(--c1);padding:4px 10px;overflow-x:auto;white-space:normal}
.cact{display:flex;align-items:center;gap:8px}
.cact .st{flex:1;font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-size:10.5px;color:var(--dim);display:flex;align-items:center;gap:7px;min-width:0}
.cact .st i{width:6px;height:6px;border-radius:50%;background:var(--c3);box-shadow:0 0 6px var(--c3);animation:blink 1.2s ease-in-out infinite;flex:0 0 auto}
.cact .st.ok{color:var(--ok);text-shadow:0 0 6px var(--ok)}
.cact .st.ok i{background:var(--ok);box-shadow:0 0 6px var(--ok);animation:none}
@keyframes blink{50%{opacity:.2}}
.cbtn{height:30px;padding:0 14px;border-radius:15px;border:1px solid var(--line2);font-weight:700;letter-spacing:.16em;text-transform:uppercase;font-size:11px;color:var(--ink)}
.cbtn.pri{border-color:var(--c3);color:var(--c3);text-shadow:0 0 6px rgba(255,212,71,.6);box-shadow:0 0 10px var(--c3s),inset 0 0 10px var(--c3s)}
.cbtn.ghost{border-color:transparent;color:var(--dim)}
.coach.min .ctext,.coach.min .cact,.coach.min .prog,.coach.min .cfig{display:none}

/* keyboard: outline keys */
.kbwrap{flex:0 0 auto;display:flex;gap:6px;height:92px}
.kbside{display:flex;flex-direction:column;gap:4px;width:42px;flex:0 0 auto}
.kbside button{flex:1;border-radius:8px;border:1px solid var(--line2);font-weight:700;font-size:10px;letter-spacing:.12em;color:var(--dim)}
.kbside .oct{flex:0 0 auto;font-family:var(--f-mono);font-weight:300;font-size:10.5px;color:var(--ink);text-align:center;padding:1px 0}
.kbside button.on{color:var(--c1);border-color:var(--c1);text-shadow:0 0 6px var(--c1);box-shadow:0 0 10px var(--c1s),inset 0 0 8px var(--c1s)}
.kb{flex:1;position:relative;touch-action:none;min-width:0}
.key{position:absolute;top:0;border-radius:0 0 7px 7px;transition:background .06s,box-shadow .06s,border-color .06s}
.key.w{height:100%;background:#000;border:1px solid var(--line2);border-top-color:transparent}
.key.b{height:60%;background:#000;border:1px solid var(--dim);z-index:2;width:auto}
.key.down,.key.lit{border-color:var(--c1);background:var(--c1s);box-shadow:0 0 12px rgba(63,228,255,.35),inset 0 0 14px rgba(63,228,255,.25);z-index:1}
.key.b.down,.key.b.lit{z-index:3}
.key.b.down,.key.b.lit{background:rgba(63,228,255,.22)}
.key .kl{position:absolute;bottom:7px;left:0;right:0;text-align:center;font-family:var(--f-mono);font-weight:300;font-size:9px;color:var(--dim);pointer-events:none}

/* sheets + start */
.sheet{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.72);display:flex;align-items:flex-end;justify-content:center}
.sheet-card{width:100%;max-width:760px;background:#000;border-top:1px solid var(--line2);box-shadow:0 -1px 18px rgba(63,228,255,.08);border-radius:20px 20px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));max-height:86%;overflow-y:auto;animation:up .25s ease}
@keyframes up{from{transform:translateY(30px);opacity:.3}to{transform:none;opacity:1}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.sheet-head h2{margin:0;font-family:var(--f-disp);font-weight:400;font-size:24px;text-transform:lowercase;color:var(--ink);text-shadow:0 0 10px rgba(242,245,248,.45);text-wrap:balance}
.lessons{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.lessons button{width:100%;display:grid;grid-template-columns:30px 1fr auto;align-items:center;gap:10px;text-align:left;padding:11px 4px;border-bottom:1px solid var(--line)}
.lessons .num{font-family:var(--f-mono);font-weight:300;font-size:11px;color:var(--faint)}
.lessons .t{font-size:16.5px;font-weight:600;letter-spacing:.01em;display:block;color:var(--ink)}
.lessons .s{font-size:12.5px;color:var(--dim);display:block;margin-top:2px;line-height:1.3;font-weight:500}
.lessons .p{font-family:var(--f-mono);font-weight:300;font-size:10.5px;color:var(--dim);white-space:nowrap}
.lessons .p.done{color:var(--ok);text-shadow:0 0 6px var(--ok)}
.lessons .grp{display:flex;flex-direction:column;gap:3px;padding:18px 4px 6px;border-bottom:1px solid var(--line2)}
.lessons .grp:first-child{padding-top:4px}
.lessons .grp .lab{font-size:11px}
.lessons .grp .gs{font-size:12.5px;color:var(--faint);font-weight:500}
.lessons .g0 .lab{color:var(--c1);text-shadow:0 0 6px var(--c1)}
.lessons .g1 .lab{color:var(--c2);text-shadow:0 0 6px var(--c2)}
.lessons .g2 .lab{color:var(--c4);text-shadow:0 0 6px var(--c4)}
.lessons button.is-rec .num{color:var(--c3);text-shadow:0 0 6px var(--c3)}
.lessons button.is-rec .t{text-shadow:0 0 10px rgba(242,245,248,.45)}
.lessons .p.rec{color:var(--c3);font-family:var(--f-ui);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:10px;text-shadow:0 0 6px var(--c3)}
.sheet-foot{display:flex;gap:8px;margin-top:14px}
.sheet-foot .cbtn{flex:1;height:38px;border-radius:19px}
.learn-card{display:flex;flex-direction:column;gap:14px}
.learn-card .sheet-head{margin-bottom:0}
.lm-body p{margin:0 0 10px;font-size:15.5px;line-height:1.55;font-weight:500;color:var(--ink);max-width:62ch;text-wrap:pretty}
.lm-body p:last-child{margin-bottom:0}
.lm-body b{color:var(--c1);font-weight:700;text-shadow:0 0 6px rgba(63,228,255,.5)}
.lm-fig{max-width:380px;padding:12px 10px}
.fig{width:100%;height:auto;display:block}
.fig .ft{font-family:var(--f-ui);font-weight:700;font-size:11.5px;letter-spacing:.14em}
.fig .fs{font-family:var(--f-ui);font-weight:500;font-size:9.5px;fill:var(--dim)}
.fig .fc{font-family:var(--f-mono);font-weight:300;font-size:9px;fill:var(--dim)}
.start{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;background:#000;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.start-card{width:100%;max-width:360px;text-align:center;display:flex;flex-direction:column;gap:16px;align-items:center}
.logo{width:100%;max-width:330px;overflow:visible}
.logo .tt{font-family:var(--f-ui);font-weight:600;font-size:38px;letter-spacing:.14em;fill:none;stroke:var(--ink);stroke-width:.9;filter:drop-shadow(0 0 3px rgba(242,245,248,.6));stroke-dasharray:420;stroke-dashoffset:420;animation:trace 2.2s ease-out forwards}

<script>
(() => {
'use strict';

/* =====================================================================
   DSP — one mono voice. Runs in an AudioWorklet (or ScriptProcessor fallback).
   Outputs 4 channels: 0 = final out, 1 = osc mix (pre-filter),
   2 = filter out (pre-VCA), 3 = trigger phase (0..1) for a rock-steady scope.
   ===================================================================== */
class SynthDSP {
  constructor(sr){
    this.sr = sr;
    this.p = {o1w:2,o1oct:0,o1pw:.5,glide:0,bl:1,o2w:2,o2oct:0,o2semi:0,o2fine:7,sync:0,fm:0,mix1:.8,mix2:.6,noise:0,vol:.7,
      ftype:0,cut:2400,res:.25,fenv:1.5,kt:.5,drive:.1,fA:.005,fD:.35,fS:.3,fR:.3,aA:.005,aD:.3,aS:.8,aR:.35,lshape:0,lrate:5,lpitch:0,lcut:0,lpw:0};
    this.k = {};
    this.p1 = 0; this.p2 = 0; this.lp = 0; this.sh = 0;
    this.note = 57; this.cur = 57; this.gate = 0;
    this.ae = 0; this.aSt = 0; this.fe = 0; this.fSt = 0;
    this.s0 = 0; this.s1 = 0; this.s2 = 0; this.s3 = 0; this.ic1 = 0; this.ic2 = 0;
    this.lc = Math.log2(2400); this.dcx = 0; this.dcy = 0; this.rng = 2463534242;
    this.tele = {a:0,f:0,l:0,c:2400,g:0,f1:220,f2:220,f0:220};
    this.calc();
  }
  calc(){
    const p = this.p, sr = this.sr, k = this.k;
    const c = (t, m) => 1 - Math.exp(-m / (Math.max(t, 0.0005) * sr));
    k.aA = c(p.aA, 1.466); k.aD = c(p.aD, 3); k.aR = c(p.aR, 3);
    k.fA = c(p.fA, 1.466); k.fD = c(p.fD, 3); k.fR = c(p.fR, 3);
    k.gl = p.glide > 0.004 ? c(p.glide, 3) : 1;
  }
  msg(d){
    if (d.t === 'p') { this.p[d.k] = d.v; this.calc(); }
    else if (d.t === 'all') { Object.assign(this.p, d.v); this.calc(); }
    else if (d.t === 'on') { this.note = d.n; this.gate = 1; this.aSt = 1; this.fSt = 1; }
    else if (d.t === 'off') { this.gate = 0; if (this.aSt) this.aSt = 3; if (this.fSt) this.fSt = 3; }
  }
  rnd(){ let x = this.rng; x ^= x << 13; x ^= x >>> 17; x ^= x << 5; this.rng = x >>> 0; return this.rng / 2147483648 - 1; }
  blep(t, dt){
    if (t < dt) { t /= dt; return t + t - t * t - 1; }
    if (t > 1 - dt) { t = (t - 1) / dt; return t * t + t + t + 1; }
    return 0;
  }
  wave(w, ph, dt, pw, bl){
    if (w === 0) return Math.sin(6.283185307179586 * ph);
    if (w === 1) return ph < 0.5 ? 4 * ph - 1 : 3 - 4 * ph;
    if (w === 2) { let v = 2 * ph - 1; if (bl) v -= this.blep(ph, dt); return v; }
    let v = ph < pw ? 1 : -1;
    if (bl) { v += this.blep(ph, dt); let q = ph - pw; if (q < 0) q += 1; v -= this.blep(q, dt); }
    return v;
  }
  render(o0, o1, o2, o3, n){
    const p = this.p, k = this.k, sr = this.sr;
    const ftype = p.ftype | 0, o1w = p.o1w | 0, o2w = p.o2w | 0, ls = p.lshape | 0;
    const bl = p.bl ? 1 : 0, sync = p.sync ? 1 : 0, fm = p.fm;
    const kk = p.res * 4.15, kq = 2 - 1.9 * p.res, drv = 1 + p.drive * 4, dcomp = 1 / (1 + p.drive * 1.5);
    const lcBase = Math.log2(Math.max(20, p.cut)), maxF = sr * 0.45;
    const r2 = Math.pow(2, p.o2oct + (p.o2semi + p.o2fine / 100) / 12), r1 = Math.pow(2, p.o1oct);
    const useP2 = !sync && p.mix2 > 0.01 && (p.mix1 < 0.01 || r2 < r1 * 0.999);
    let lfo = 0, fc = 20;
    for (let i = 0; i < n; i++) {
      this.cur += (this.note - this.cur) * k.gl;
      this.lp += p.lrate / sr; let wr = false; if (this.lp >= 1) { this.lp -= 1; wr = true; }
      const lp = this.lp;
      if (ls === 0) lfo = lp < 0.5 ? 4 * lp - 1 : 3 - 4 * lp;
      else if (ls === 1) lfo = lp < 0.5 ? 1 : -1;
      else if (ls === 2) lfo = 1 - 2 * lp;
      else if (ls === 3) lfo = 2 * lp - 1;
      else { if (wr) this.sh = this.rnd(); lfo = this.sh; }
      switch (this.aSt) {
        case 1: this.ae += (1.3 - this.ae) * k.aA; if (this.ae >= 1) { this.ae = 1; this.aSt = 2; } break;
        case 2: this.ae += (p.aS - this.ae) * k.aD; break;
        case 3: this.ae -= this.ae * k.aR; if (this.ae < 1e-5) { this.ae = 0; this.aSt = 0; } break;
      }
      switch (this.fSt) {
        case 1: this.fe += (1.3 - this.fe) * k.fA; if (this.fe >= 1) { this.fe = 1; this.fSt = 2; } break;
        case 2: this.fe += (p.fS - this.fe) * k.fD; break;
        case 3: this.fe -= this.fe * k.fR; if (this.fe < 1e-5) { this.fe = 0; this.fSt = 0; } break;
      }
      const base = 440 * Math.pow(2, (this.cur - 69 + p.lpitch * lfo) / 12);
      const dt1 = Math.min(base * r1 / sr, 0.45), dt2 = Math.min(base * r2 / sr, 0.45);
      this.p1 += dt1; let w1 = false; if (this.p1 >= 1) { this.p1 -= 1; w1 = true; }
      let pw = p.o1pw + p.lpw * lfo; pw = pw < 0.04 ? 0.04 : pw > 0.96 ? 0.96 : pw;
      const v1 = this.wave(o1w, this.p1, dt1, pw, bl);
      this.p2 += dt2; if (this.p2 >= 1) this.p2 -= 1;
      if (sync && w1) { const q = this.p1 * dt2 / dt1; this.p2 = q - Math.floor(q); }
      let v2;
      if (fm > 0.001) { let q = this.p2 + fm * v1 * 0.15915494309189535; q -= Math.floor(q); v2 = this.wave(o2w, q, dt2, pw, 0); }
      else v2 = this.wave(o2w, this.p2, dt2, pw, sync ? 0 : bl);
      const mix = (v1 * p.mix1 + v2 * p.mix2 + this.rnd() * p.noise) * 0.6;
      const tgt = lcBase + p.fenv * this.fe + p.lcut * lfo + (this.cur - 60) / 12 * p.kt;
      this.lc += (tgt - this.lc) * 0.02;
      fc = Math.pow(2, this.lc); if (fc > maxF) fc = maxF; else if (fc < 16) fc = 16;
      const g = Math.tan(Math.PI * fc / sr);
      const x = mix * drv + this.rnd() * 1e-4; let y;
      if (ftype === 0) {
        const G = g / (1 + g), b = 1 - G, G4 = G * G * G * G;
        const S = G * G * G * b * this.s0 + G * G * b * this.s1 + G * b * this.s2 + b * this.s3;
        let y4 = (G4 * x + S) / (1 + kk * G4);
        const u = Math.tanh(x - kk * y4);
        let v = (u - this.s0) * G; const y1 = v + this.s0; this.s0 = y1 + v;
        v = (y1 - this.s1) * G; const y2 = v + this.s1; this.s1 = y2 + v;
        v = (y2 - this.s2) * G; const y3 = v + this.s2; this.s2 = y3 + v;
        v = (y3 - this.s3) * G; y4 = v + this.s3; this.s3 = y4 + v;
        y = y4 * (1 + kk * 0.45);
      } else {
        const a1 = 1 / (1 + g * (g + kq)), a2 = g * a1, a3 = g * a2;
        const v0 = Math.tanh(x), v3 = v0 - this.ic2;
        const vv1 = a1 * this.ic1 + a2 * v3, vv2 = this.ic2 + a2 * this.ic1 + a3 * v3;
        this.ic1 = 2 * vv1 - this.ic1; this.ic2 = 2 * vv2 - this.ic2;
        y = ftype === 1 ? vv2 : ftype === 2 ? v0 - kq * vv1 - vv2 : vv1 * Math.max(kq, 0.6);
        y = Math.tanh(y * 0.7 / (1 + p.res)) / 0.7;
      }
      y *= dcomp;
      let o = Math.tanh(y * this.ae * p.vol * 1.2);
      const dc = o - this.dcx + 0.997 * this.dcy; this.dcx = o; this.dcy = dc;
      o0[i] = dc; o1[i] = mix * 1.5; o2[i] = y * 1.5; o3[i] = useP2 ? this.p2 : this.p1;
    }
    const fb = 440 * Math.pow(2, (this.cur - 69) / 12), t = this.tele;
    t.a = this.ae; t.f = this.fe; t.l = lfo; t.c = fc; t.g = this.gate; t.f1 = fb * r1; t.f2 = fb * r2; t.f0 = useP2 ? t.f2 : t.f1;
  }
}

const WORKLET_TAIL = `
class SPProc extends AudioWorkletProcessor {
  constructor(){ super(); this.d = new SynthDSP(sampleRate); this.c = 0; this.port.onmessage = e => this.d.msg(e.data); }
  process(i, o){
    const ch = o[0], n = ch[0].length;
    this.d.render(ch[0], ch[1] || ch[0], ch[2] || ch[0], ch[3] || ch[0], n);
    if (++this.c >= 3) { this.c = 0; this.port.postMessage(this.d.tele); }
    return true;
  }
}
registerProcessor('sp-synth', SPProc);`;

/* =====================================================================
   Parameters
   ===================================================================== */
const INIT = {o1w:2,o1oct:0,o1pw:.5,glide:0,bl:1,o2w:2,o2oct:0,o2semi:0,o2fine:7,sync:0,fm:0,mix1:.8,mix2:.6,noise:0,vol:.7,
  ftype:0,cut:2400,res:.25,fenv:1.5,kt:.5,drive:.1,fA:.005,fD:.35,fS:.3,fR:.3,aA:.005,aD:.3,aS:.8,aR:.35,lshape:0,lrate:5,lpitch:0,lcut:0,lpw:0};
const params = {...INIT};

const sgn = v => (v > 0 ? '+' : v < 0 ? '−' : '');
const fHz = v => v >= 1000 ? (v / 1000).toFixed(v >= 10000 ? 1 : 2) + ' kHz' : (v < 100 ? v.toFixed(1) : Math.round(v)) + ' Hz';
const fT = v => v < 1 ? (v < 0.01 ? (v * 1000).toFixed(1) : Math.round(v * 1000)) + ' ms' : v.toFixed(2) + ' s';
const fPct = v => Math.round(v * 100) + '%';
const fOct = v => sgn(v) + Math.abs(v).toFixed(1) + ' oct';
const DEFS = {
  o1oct:{l:'Octave',min:-2,max:2,step:1,f:v=>sgn(v)+Math.abs(v)},
  o1pw:{l:'Pulse Width',min:.05,max:.95,f:fPct},
  glide:{l:'Glide',min:0,max:2,c:'sq',f:v=>v<0.005?'off':fT(v)},
  o2oct:{l:'Octave',min:-2,max:2,step:1,f:v=>sgn(v)+Math.abs(v)},
  o2semi:{l:'Semi',min:-12,max:24,step:1,f:v=>sgn(v)+Math.abs(v)+' st'},
  o2fine:{l:'Fine',min:-50,max:50,step:1,bip:1,f:v=>sgn(v)+Math.abs(v)+' ct'},
  fm:{l:'FM Index',min:0,max:10,c:'sq',f:v=>'I '+v.toFixed(2)},
  mix1:{l:'OSC 1',min:0,max:1,f:fPct}, mix2:{l:'OSC 2',min:0,max:1,f:fPct},
  noise:{l:'Noise',min:0,max:1,f:fPct}, vol:{l:'Volume',min:0,max:1,f:fPct},
  cut:{l:'Cutoff',min:20,max:20000,c:'log',f:fHz},
  res:{l:'Resonance',min:0,max:1,f:v=>'k '+(v*4.15).toFixed(2)},
  fenv:{l:'Env Amt',min:-6,max:6,bip:1,f:fOct},
  kt:{l:'Key Track',min:0,max:1,f:fPct},
  drive:{l:'Drive',min:0,max:1,f:fPct},
  fA:{l:'Attack',min:.001,max:10,c:'log',f:fT}, fD:{l:'Decay',min:.005,max:10,c:'log',f:fT},
  fS:{l:'Sustain',min:0,max:1,f:fPct}, fR:{l:'Release',min:.005,max:10,c:'log',f:fT},
  aA:{l:'Attack',min:.001,max:10,c:'log',f:fT}, aD:{l:'Decay',min:.005,max:10,c:'log',f:fT},
  aS:{l:'Sustain',min:0,max:1,f:fPct}, aR:{l:'Release',min:.005,max:10,c:'log',f:fT},
  lrate:{l:'Rate',min:.05,max:30,c:'log',f:v=>(v<10?v.toFixed(2):v.toFixed(1))+' Hz'},
  lpitch:{l:'→ Pitch',min:0,max:12,c:'sq',f:v=>v<1?Math.round(v*100)+' ct':v.toFixed(1)+' st'},
  lcut:{l:'→ Cutoff',min:0,max:4,f:v=>'±'+v.toFixed(1)+' oct'},
  lpw:{l:'→ PW',min:0,max:.45,f:v=>'±'+Math.round(v*100)+'%'},
};
const IC = {
  sine:'<svg viewBox="0 0 14 12"><path d="M1 6C3 -1.5 5 -1.5 7 6S11 13.5 13 6"/></svg>',
  tri:'<svg viewBox="0 0 14 12"><path d="M1 6L4 1.5 10 10.5 13 6"/></svg>',
  saw:'<svg viewBox="0 0 14 12"><path d="M1 10.5L7 1.5V10.5L13 1.5"/></svg>',
  sawdn:'<svg viewBox="0 0 14 12"><path d="M1 1.5L7 10.5V1.5L13 10.5"/></svg>',
  pulse:'<svg viewBox="0 0 14 12"><path d="M1 10.5V1.5H5V10.5H9V1.5H13"/></svg>',
  sh:'<svg viewBox="0 0 14 12"><path d="M1 8H4V2H7V10.5H10V5H13"/></svg>',
};
const SEGS = {
  o1w:{l:'Wave',o:[['sine','Sine'],['tri','Tri'],['saw','Saw'],['pulse','Pulse']]},
  o2w:{l:'Wave',o:[['sine','Sine'],['tri','Tri'],['saw','Saw'],['pulse','Pulse']]},
  ftype:{l:'Type',o:[[null,'LP24'],[null,'LP12'],[null,'HP'],[null,'BP']]},
  lshape:{l:'Shape',o:[['tri','Tri'],['pulse','Sqr'],['sawdn','Dn'],['saw','Up'],['sh','S&H']]},
};
const TOGS = { bl:{l:'Anti-alias',s:'PolyBLEP'}, sync:{l:'Hard Sync',s:'to OSC 1'} };
const TABS = [
  {id:'osc1',l:'Osc 1',seg:'o1w',rows:[['o1oct','o1pw','glide'],['bl']]},
  {id:'osc2',l:'Osc 2',seg:'o2w',rows:[['o2oct','o2semi','o2fine'],['fm','sync']]},
  {id:'mix',l:'Mix',rows:[['mix1','mix2','noise'],['vol']]},
  {id:'filter',l:'Filter',seg:'ftype',rows:[['cut','res','fenv'],['kt','drive']]},
  {id:'env',l:'Env',env:1},
  {id:'lfo',l:'LFO',seg:'lshape',rows:[['lrate','lpitch','lcut'],['lpw']]},
];
const TAB_OF = {};
TABS.forEach(t => { if (t.seg) TAB_OF[t.seg] = t.id; (t.rows || []).flat().forEach(k => TAB_OF[k] = t.id); });
['fA','fD','fS','fR','aA','aD','aS','aR'].forEach(k => TAB_OF[k] = 'env');

const toN = (d, v) => {
  const r = d.c === 'log' ? Math.log(Math.max(v, d.min) / d.min) / Math.log(d.max / d.min)
          : d.c === 'sq' ? Math.sqrt(Math.max(0, (v - d.min) / (d.max - d.min)))
          : (v - d.min) / (d.max - d.min);

const NAMES = ['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'];
const nName = n => NAMES[n % 12] + (Math.floor(n / 12) - 1);
const kb = $('kb');
function buildKeys(){
  kb.innerHTML = '';
  const whites = [0, 2, 4, 5, 7, 9, 11, 12], blacks = {1:0, 3:1, 6:3, 8:4, 10:5};
  const ww = 100 / whites.length;
  whites.forEach((s, i) => {
    const k = document.createElement('div'); k.className = 'key w'; k.dataset.n = state.base + s;
    k.style.left = (i * ww) + '%'; k.style.width = `calc(${ww}% + 1px)`;
    if (s === 0 || s === 12) k.innerHTML = `<span class="kl">${nName(state.base + s)}</span>`;
    kb.appendChild(k);
  });
  Object.entries(blacks).forEach(([s, wi]) => {
    const k = document.createElement('div'); k.className = 'key b'; k.dataset.n = state.base + +s;
    k.style.left = ((wi + 1) * ww - ww * 0.31) + '%'; k.style.width = (ww * 0.62) + '%';
    kb.appendChild(k);
  });
  $('octLbl').textContent = nName(state.base);
  litKeys();
}
function litKeys(){
  [...kb.children].forEach(k => {
    const n = +k.dataset.n;
    k.classList.toggle('down', state.held.includes(n));
    k.classList.toggle('lit', state.hold && state.latched === n);
  });
}
function synthOn(n){ Engine.post({t:'on', n}); state.gateOn = true; state.gates++; state.lastNote = n; }
function synthOff(){ Engine.post({t:'off'}); state.gateOn = false; }
function press(n){
  if (!Engine.ready) Engine.start();
  if (state.hold && state.held.length === 0 && state.latched === n) { state.latched = null; synthOff(); litKeys(); return; }
  state.held.push(n);
  if (state.hold) state.latched = n;
  synthOn(n); litKeys();
}
function release(n){
  const i = state.held.lastIndexOf(n); if (i >= 0) state.held.splice(i, 1);
  if (state.held.length) synthOn(state.held[state.held.length - 1]);
  else if (!state.hold) synthOff();
  litKeys();
}
const ptrNote = new Map();
const keyAt = (x, y) => { const el = document.elementFromPoint(x, y); const k = el && el.closest && el.closest('.key'); return k && kb.contains(k) ? +k.dataset.n : null; };
kb.addEventListener('pointerdown', e => { e.preventDefault(); const n = keyAt(e.clientX, e.clientY); if (n == null) return; ptrNote.set(e.pointerId, n); press(n); });
kb.addEventListener('pointermove', e => {
  if (!ptrNote.has(e.pointerId)) return;
  const n = keyAt(e.clientX, e.clientY), o = ptrNote.get(e.pointerId);
  if (n != null && n !== o) { ptrNote.set(e.pointerId, n); const i = state.held.lastIndexOf(o); if (i >= 0) state.held.splice(i, 1); state.held.push(n); if (state.hold) state.latched = n; synthOn(n); litKeys(); }
});
const kbUp = e => { if (!ptrNote.has(e.pointerId)) return; const n = ptrNote.get(e.pointerId); ptrNote.delete(e.pointerId); release(n); };
kb.addEventListener('pointerup', kbUp); kb.addEventListener('pointercancel', kbUp);

function setHold(n){

}

{ id:'sampling', g:2, t:'Samples & aliasing', s:'What the DAC actually draws, and where fold-back comes from.',
  setup:{...BASE}, hold:57, go:{page:1, mode:'wave', tap:'osc', zoom:9.6},
  steps:[
  {x:"This is OSC 1, a 220 Hz saw. Tap + a few times to zoom in, until the line turns into separate dots.", focus:['zoom'], goal:S=>S.zoom<=110,
   more:{h:'What zoom shows', b:['Each + halves how much time fits on screen. The readout underneath counts the samples (smp) on screen. Below about 100 samples there is enough room to draw each one as a dot.']}},
  {x:"Each dot is one sample: a number the synth computes {sr} times a second. The speaker only ever gets these dots; the thin line is how the converter joins them up.",
   more:{h:'From dots to sound', b:['A digital synth never makes a continuous wave. It computes one number per sample period, and the DAC (digital-to-analog converter) turns that stream back into a voltage.', 'The DAC does not join the dots with straight lines. It draws the smoothest curve that contains no frequencies above half the sample rate. That is the thin line.', 'The little ripples next to the saw\'s jump are real: a curve with no very high frequencies cannot jump instantly, so it overshoots and rings (the Gibbs effect).'], m:'x(t) = Σ x[n] · sinc(fs·t − n)'}},
  {x:"Shift the keyboard up an octave or two (▲) and play a high note. Higher pitch means fewer samples per cycle.", focus:['octUp'], hold:true, goal:S=>S.hz>=860},
  {x:S=>`At ${fHz(S.hz)} one cycle is only ${(SR / S.hz).toFixed(1)} samples. A saw's harmonics run far past half the sample rate (${fHz(SR / 2)}), and those are the problem.`,
   more:{h:'The Nyquist limit', b:['With samples at rate fs, the highest frequency you can represent is fs/2, the Nyquist frequency. It takes at least two samples per cycle to capture a wave.', 'You may know this from control loops: a 1 ms scan can\'t see anything faster than 500 Hz.']}},
  {x:"Switch the scope to Spectrum, then tap the axis button so it reads Lin. Harmonics now sit evenly spaced at f0, 2f0, 3f0…", focus:['modeSeg','lin'], goal:S=>S.mode==='spec'&&S.lin},
  {x:"Turn Anti-alias off on the Osc 1 tab. The mini scope up top shows the same spectrum.", focus:['bl'], goal:S=>!S.p.bl},
  {x:"Extra lines appear between the true harmonics. Anything above Nyquist folds back down, landing where no harmonic belongs.", go:{page:1},
   more:{h:'Folding back', b:['Frequencies above Nyquist do not vanish. They show up at a wrong, lower frequency, mirrored around Nyquist. That is <b>aliasing</b>.', 'Controls analogy: sample a fast vibration too slowly and you see a slow, fake oscillation on the trend. Same effect, in the audio band. A saw\'s harmonics go on forever, so a simple digital saw always has some above Nyquist.'], m:'f_alias = | n·f0 − k·fs |'}},
  {x:"Play slowly up the top octave and listen for faint tones sliding the wrong way. That inharmonic whistle is aliasing."},
  {x:"Turn Anti-alias back on. PolyBLEP smooths each jump over about two samples, which removes most of the fold-back.", focus:['bl'], goal:S=>!!S.p.bl,
   more:{h:'PolyBLEP', b:['The aliasing comes from the instant jump in the saw. PolyBLEP (polynomial band-limited step) adds a tiny correction curve over the two samples around each jump, so the jump\'s highest harmonics are mostly gone before they can fold back.', 'Commercial engines use this or similar tricks, plus oversampling: computing at a higher rate internally, then filtering down.']}},
  {nord:1, x:"Play a bright saw high up on your Nord and listen for the same whistle. Band-limited waves and oversampling are how commercial engines keep it quiet."},
  ]},
{ id:'harmonics', g:2, t:'Harmonics in depth', s:'Pulse width, the 1/n² triangle, and PWM.',
  setup:{...BASE}, hold:45, go:{page:1, mode:'spec', tap:'osc', lin:false},
  steps:[
  {x:"A 110 Hz saw has every harmonic at strength 1/n. On this log axis that is a straight slope of about −6 dB per octave.", m:'saw(t) = (2/π) Σ (−1)ⁿ⁺¹ sin(nωt) / n'},
  {x:"Switch OSC 1 to Pulse and watch the even harmonics drop away.", focus:['o1w'], setup:{o1pw:.5}, goal:S=>S.p.o1w===3},

   more:{h:'Where the notches come from', b:['A pulse of width d (as a fraction of the cycle) has harmonic n with strength proportional to |sin(π·n·d)|/n. Whenever n·d is a whole number, the sine is zero and that harmonic disappears.', 'At d = 1/2 that kills every 2nd harmonic. At 1/3, every 3rd. At 1/4, every 4th.'], m:'|cₙ| ∝ |sin(π·n·d)| / n'}},

   more:{h:'Why 1/n²', b:['A triangle is the integral of a square wave. Integrating divides each harmonic by its number n, so the square\'s 1/n becomes 1/n². Fewer corners, faster roll-off, softer sound.']}},
  {x:"Flip the scope to Wave to compare these shapes in time.", focus:['modeSeg'], goal:S=>S.mode==='wave'},
  {x:"Back on Pulse. On the LFO tab, raise → PW. Notches sweeping through the spectrum give the classic PWM string sound.", setup:{o1w:3,o1pw:.5,lshape:0,lrate:.6}, go:{mode:'spec'}, focus:['lpw'], goal:S=>S.p.lpw>=.15},

{ id:'moog', g:2, t:'The Moog ladder', s:'Minimoog Model D: 24 dB/oct, resonance and self-oscillation.',
  setup:{...BASE, cut:600}, hold:45, go:{page:1, mode:'spec', tap:'filter', lin:false, ghost:true},
  steps:[
  {x:"The Model D's sound comes from Bob Moog's transistor ladder: four simple filter stages in a row, inside a feedback loop. Cyan is after the filter; the faint white ghost is the raw oscillator.",
   more:{h:'The ladder', b:['Each stage is a one-pole lowpass (−6 dB/oct). Four in series give −24 dB/oct. Resonance feeds the output back to the input with a negative sign, with gain k.', 'At the cutoff, each stage shifts phase by 45°, so four stages total 180°. The negative feedback becomes positive at exactly that frequency, which is why the peak sits at fc.'], m:'H(s) = 1 / ((1 + s/ωc)⁴ + k)'}},
  {x:"Sweep Cutoff up and down. Past the cutoff, the slope steepens by 24 dB per octave, on top of the saw's own 6.", focus:['cut'], goal:(S,E)=>moved(S.p.cut,E.p.cut,2)},

  {x:"Watch the lowest spike: it sinks as resonance rises. That is the famous Moog bass loss.",
   more:{h:'Why the bass drops', b:['At DC and low frequencies the four stages pass the signal at full gain, so the feedback subtracts k times the output from the input. The result: low-frequency gain becomes 1/(1+k).', 'At k = 4 the low end is down to a fifth, about −14 dB. Many later designs add compensation; part of the Model D\'s character is that it doesn\'t.'], m:'|H(0)| = 1 / (1 + k)'}},
  {x:"Push Resonance all the way up. At k = 4 the feedback is strong enough that the filter rings on its own.", focus:['res'], goal:S=>S.p.res>=.97,
   more:{h:'Self-oscillation', b:['At fc the loop gain is k × (1/√2)⁴ = k/4. When k reaches 4, the loop gain is 1 with 180° phase: the classic condition for a sustained oscillation (the Barkhausen criterion, if you remember it from controls).', 'Real ladders have transistors that saturate, which limits how loud the oscillation grows. This model uses a tanh saturation for the same job.']}},

  {x:"On the Env tab, drop Filter Sustain to 0 and Decay to about 250 ms. Play short notes: the thump is the cutoff snapping shut.", focus:['fS','fD'], goal:S=>S.p.fS<=.05&&S.p.fD<=.4},
  {nord:1, x:"Pick the LP M filter (the ladder model), raise Res, set Filter Tracking to Full, and repeat steps 3 to 7. Listen for how close it gets to ringing on its own."},
  ]},

const coach = {L:null, i:0, E:null, met:false, timer:0, done:false};
const prog = store.get('progress', {});
const HINT_PAGE = {zoom:1, modeSeg:1, lin:1, tapSeg:1, ghost:1, octUp:-1, pageScope:-1, pagePatch:-1};
function applyHints(){
  document.querySelectorAll('.hint').forEach(e => e.classList.remove('hint'));
  document.querySelectorAll('.dot').forEach(e => e.classList.remove('dot'));
  state.hints.forEach(h => {
    document.querySelectorAll(`[data-hint="${h}"]`).forEach(e => e.classList.add('hint'));
    const pg = HINT_PAGE[h] ?? 0;
    if (pg >= 0 && pg !== state.page) $('pageSeg').children[pg].classList.add('dot');
    const tab = TAB_OF[h];
    if (tab && tab !== state.tab) { const b = $('tabs').querySelector(`[data-tab="${tab}"]`); if (b) b.classList.add('dot'); }
  });
}
function applyGo(go){
  if (go.mode) setMode(go.mode);
  if (go.tap) setTap(go.tap);
  if ('lin' in go) setLin(go.lin);
  if ('ghost' in go) setGhost(go.ghost);
  if (go.zoom) setZoom(go.zoom);
  if (go.tab) showTab(go.tab);
  if ('page' in go) goPage(go.page);
}
function startLesson(id){
  const L = LESSONS.find(l => l.id === id); if (!L) return;
  const pr = prog[id] || {};
  coach.L = L; coach.done = false;
  applyPatch({...INIT, ...L.setup});
  setHold(L.hold === undefined ? null : L.hold);
  if (L.go) applyGo(L.go);
  closeSheet();
  $('coach').classList.remove('min');
  goStep(pr.done ? 0 : Math.min(pr.step || 0, L.steps.length - 1));
  store.set('last', id);
}
function goStep(i){
  const L = coach.L, st = L.steps[i];
  clearTimeout(coach.timer);
  coach.i = i; coach.met = false; coach.done = false;
  if (st.setup) applyPatch(st.setup);
  if ('hold' in st) setHold(st.hold);
  if (st.go) applyGo(st.go);
  coach.E = {p:{...params}, gates:state.gates, n:{...state.nchg}, zoom:Math.pow(2, state.zoomL2)};
  state.hints = new Set(st.focus || []);
  const tabFocus = (st.focus || []).map(f => TAB_OF[f]).find(Boolean);
  if (tabFocus && tabFocus !== state.tab) showTab(tabFocus); else applyHints();
  prog[L.id] = {...(prog[L.id] || {}), step:i}; store.set('progress', prog);
  renderCoach();
}
function snapshot(){ return {p:params, n:state.nchg, page:state.page, mode:state.mode, tap:state.tap, lin:state.lin, zoom:Math.pow(2, state.zoomL2), hz:tele.f1, note:state.lastNote, playing:state.gateOn, gates:state.gates}; }
function fillText(x){ return (typeof x === 'function' ? x(snapshot()) : x).replace('{sr}', SR.toLocaleString() + ' Hz').replace('{nyq}', fHz(SR / 2)); }
function renderCoach(){
  const ct = $('ctext'), fg = $('cfig');
  ct.style.animation = 'none'; void ct.offsetWidth; ct.style.animation = '';
  $('learnBtn').hidden = true; fg.hidden = true;
  if (!coach.L) {
    $('crumbT').textContent = 'Free play'; $('crumbN').textContent = '';
    $('nordTag').hidden = true; $('progBar').style.width = '0';
    ct.textContent = 'Patch anything and the scope follows. Swipe between Patch and Scope, or pick a lesson for guided steps on the synth.';
    $('cBack').hidden = true; $('cStatus').innerHTML = ''; $('cNext').textContent = 'Lessons'; $('cNext').classList.add('pri');
    return;
  }
  const L = coach.L, st = L.steps[coach.i], n = L.steps.length;
  $('crumbT').textContent = L.t; $('crumbN').textContent = coach.done ? 'done' : `${coach.i + 1}/${n}`;
  $('nordTag').hidden = !st.nord || coach.done;
  $('progBar').style.width = ((coach.done ? n : coach.i + (coach.met ? 1 : 0)) / n * 100) + '%';
  if (coach.done) {
    const nx = nextLesson(L.id);
    ct.textContent = nx ? `Lesson complete. Up next: ${nx.t}. Or keep playing with this patch.` : 'Lesson complete. The patch is yours to keep playing with.';
    $('cBack').hidden = false; $('cStatus').innerHTML = '';
    $('cNext').textContent = nx ? 'Next lesson' : 'Lessons'; $('cNext').classList.add('pri');
    return;
  }
  ct.textContent = fillText(st.x);
  if (st.fig && FIGS[st.fig]) { fg.innerHTML = FIGS[st.fig](); fg.hidden = false; }
  $('learnBtn').hidden = !(st.more || st.m);
  $('cBack').hidden = coach.i === 0;
  renderStatus();
}
function renderStatus(){
  const st = coach.L.steps[coach.i], s = $('cStatus'), nx = $('cNext');
  const last = coach.i === coach.L.steps.length - 1;
  if (st.goal) {
    s.className = 'st' + (coach.met ? ' ok' : '');
    s.innerHTML = coach.met ? '<i></i>Got it' : '<i></i>Your turn';
    nx.textContent = coach.met ? (last ? 'Finish' : 'Next') : 'Skip';
    nx.classList.toggle('pri', coach.met);
  } else {
    s.className = 'st'; s.innerHTML = '';
    nx.textContent = last ? 'Finish' : 'Next'; nx.classList.add('pri');
  }
}
function nextLesson(id){ const i = LESSONS.findIndex(l => l.id === id); return LESSONS.slice(i + 1).find(l => !(prog[l.id] || {}).done) || null; }
function next(){
  if (!coach.L) { openSheet(); return; }
  if (coach.done) { const nx = nextLesson(coach.L.id); nx ? startLesson(nx.id) : openSheet(); return; }
  if (coach.i < coach.L.steps.length - 1) goStep(coach.i + 1);
  else {
    coach.done = true; state.hints.clear(); applyHints();
    prog[coach.L.id] = {step:0, done:true}; store.set('progress', prog);
    renderCoach();
  }
}
function checkGoal(){
  if (!coach.L || coach.done || coach.met) return;
  const st = coach.L.steps[coach.i];
  if (!st.goal || !$('learn').hidden) return;
  let ok = false; try { ok = st.goal(snapshot(), coach.E); } catch (e) {}
  if (ok) {
    coach.met = true; state.hints.clear(); applyHints(); renderStatus();
    $('progBar').style.width = ((coach.i + 1) / coach.L.steps.length * 100) + '%';
    try { navigator.vibrate && navigator.vibrate(12); } catch (e) {}
    coach.timer = setTimeout(next, 1200);
  }
}
$('cNext').addEventListener('click', () => { clearTimeout(coach.timer); next(); });
$('cBack').addEventListener('click', () => { if (!coach.L) return; if (coach.done) { goStep(coach.L.steps.length - 1); return; } if (coach.i > 0) goStep(coach.i - 1); });
$('coachMin').addEventListener('click', () => $('coach').classList.toggle('min'));
$('crumb').addEventListener('click', openSheet);

/* ---------- Learn more ---------- */
function openLearn(){
  if (!coach.L) return;
  const st = coach.L.steps[coach.i], mo = st.more || {h:'The math', b:[]};
  $('lmTitle').textContent = mo.h;
  $('lmBody').innerHTML = mo.b.map(p => `<p>${p}</p>`).join('');
  const f = $('lmFig'); f.hidden = !mo.fig; f.innerHTML = mo.fig && FIGS[mo.fig] ? FIGS[mo.fig]() : '';
  const m = mo.m || st.m; $('lmMath').hidden = !m; $('lmMath').textContent = m || '';
  $('learn').hidden = false;
}
const closeLearn = () => { $('learn').hidden = true; };
$('learnBtn').addEventListener('click', openLearn);
$('lmClose').addEventListener('click', closeLearn);
$('learn').addEventListener('click', e => { if (e.target === $('learn')) closeLearn(); });

/* ---------- lesson list ---------- */
function openSheet(){
  const ol = $('lessonList'); ol.innerHTML = '';
  const rec = LESSONS.find(l => !(prog[l.id] || {}).done);
  let num = 0;
  GROUPS.forEach((G, gi) => {
    const h = document.createElement('li'); h.className = 'grp g' + gi;
    h.innerHTML = `<span class="lab">${G.t}</span><span class="gs">${G.s}</span>`;
    ol.appendChild(h);
    LESSONS.filter(L => L.g === gi).forEach(L => {
      num++;
      const pr = prog[L.id] || {};
      const isRec = rec && rec.id === L.id;
      const p = pr.done ? '<span class="p done">✓ done</span>'
        : pr.step ? `<span class="p">${pr.step + 1}/${L.steps.length}</span>`
        : isRec ? `<span class="p rec">${num === 1 ? 'Start here' : 'Up next'}</span>`
        : `<span class="p">${L.steps.length} steps</span>`;
      const li = document.createElement('li');
      li.innerHTML = `<button class="${isRec ? 'is-rec' : ''}"><span class="num">${String(num).padStart(2, '0')}</span><span><span class="t">${L.t}</span><span class="s">${L.s}</span></span>${p}</button>`;
      li.firstChild.addEventListener('click', () => startLesson(L.id));
      ol.appendChild(li);
    });
  });
  $('sheet').hidden = false;
  const r = ol.querySelector('.is-rec'); if (r) r.scrollIntoView({block:'nearest'});
}
function closeSheet(){ $('sheet').hidden = true; }
$('btnLessons').addEventListener('click', openSheet);
$('sheetClose').addEventListener('click', closeSheet);
$('sheet').addEventListener('click', e => { if (e.target === $('sheet')) closeSheet(); });
$('freeBtn').addEventListener('click', () => { coach.L = null; state.hints.clear(); applyHints(); renderCoach(); closeSheet(); });
$('initBtn').addEventListener('click', () => { applyPatch({...INIT}); closeSheet(); });

/* =====================================================================
   Main loop
   ===================================================================== */
let frameN = 0, lastNoteTxt = '';
function frame(){
  requestAnimationFrame(frame);
  frameN++;
  const showBig = state.page === 1, showMini = state.page === 0;
  if (Engine.ready && state.run && state.mode !== 'env') {
    const i = TAPI[state.tap];
    if (state.mode === 'wave') {
      Engine.an[3].getFloatTimeDomainData(TD[3]);
      Engine.an[i].getFloatTimeDomainData(TD[i]);
      if (state.ghost && i !== 1) Engine.an[1].getFloatTimeDomainData(TD[1]);
    } else {
      Engine.an[i].getFloatFrequencyData(FD[i]);
      if (state.ghost && i !== 1) Engine.an[1].getFloatFrequencyData(FD[1]);
    }
  }
  let win = 0;
  if (showBig) win = drawScreen(screens[0]) || Math.pow(2, state.zoomL2);
  if (showMini || frameN % 6 === 0) drawScreen(screens[1]);
  if (frameN % 5 === 0) {
    updateScopeText(win || Math.pow(2, state.zoomL2));
    const nt = nName(state.lastNote);
    if (nt !== lastNoteTxt) { $('rdNote').textContent = nt; lastNoteTxt = nt; }
    $('rdHz').textContent = tele.f1.toFixed(1) + ' Hz';
    $('gateLed').classList.toggle('on', state.gateOn);
    checkGoal();
  }
}

/* ---------- boot ---------- */
function preview(){
  const d = new SynthDSP(48000);
  d.msg({t:'all', v:{...params}});
  const junk = [new Float32Array(4096), new Float32Array(4096), new Float32Array(4096), new Float32Array(4096)];
  d.render(junk[0], junk[1], junk[2], junk[3], 4096);
  d.render(TD[0], TD[1], TD[2], TD[3], N);
  Object.assign(tele, d.tele);
}
buildTabs(); showTab('osc1'); buildKeys(); setMode('wave'); setTap('filter'); renderCoach(); preview();
requestAnimationFrame(frame);
$('goBtn').addEventListener('click', async () => {
  $('start').hidden = true;
  await Engine.start();
  openSheet();
});
})();
</script>
<script>
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
